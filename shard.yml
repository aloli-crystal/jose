name: jose
version: 0.2.0
description: |
  JOSE (RFC 7515-7519) implementation in pure Crystal: JSON Web
  Signature, JSON Web Encryption, JSON Web Key.
  Elliptic curve: ECDH-ES (P-256/P-384/P-521), JWE A256GCM, JWS
  ES256/ES384/ES512, JWK thumbprints.
  RSA: JWS RS256/RS384/RS512, RSA JWK with PKCS#1, PKCS#8 and
  SubjectPublicKeyInfo DER — for OpenID Connect and WebAuthn.
authors:
  - Philippe Nénert <philippe@aloli.fr>
license: MIT
crystal: ">= 1.19.0"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
