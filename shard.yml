name: jose
version: 0.1.1
description: |
  JOSE (RFC 7515-7519) implementation in pure Crystal: JSON Web
  Signature, JSON Web Encryption, JSON Web Key.
  Initial scope optimized for use by crystal-clevis-geli (Tang
  client): ECDH-ES (P-256/P-384/P-521), JWE A256GCM, JWS
  ES256/ES512, JWK thumbprints.
authors:
  - Philippe Nénert <philippe@aloli.fr>
license: MIT
crystal: ">= 1.19.0"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
