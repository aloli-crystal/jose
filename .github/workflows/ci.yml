name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        crystal: ["1.19.0", "1.19.1"]

    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install dependencies
        run: shards install

      - name: Check formatting
        run: crystal tool format --check

      - name: Run tests
        run: crystal spec

      - name: Run linter
        # ameba 1.6 fournissait un `postinstall` qui compilait `bin/ameba` dans
        # le projet consommateur ; la 1.7 l'a supprimé, comme son TODO
        # l'annonçait. On l'invoque depuis ses sources, ce qui fonctionne
        # quelle que soit la version résolue — shard.lock épingle encore 1.6.4.
        run: crystal run lib/ameba/bin/ameba.cr -- src spec
